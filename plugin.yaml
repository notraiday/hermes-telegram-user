name: telegram-user
label: Telegram User (MTProto)
version: "0.12.0+rai.10"
description: Tools over one or more Telegram user accounts (MTProto) — each read-only or read-write, each with its own proxy. Reading, search, unread/folder/inbox digests with local marks, collections, archive with offline search, media and voice transcripts; on write accounts also sending, replies, files, forwards, reactions, edits, deletions, pins and read marks. No chat platform — talk to Hermes through the regular Telegram bot.
author: community
# Declared here, not only in requirements.txt: Hermes installs these into its own
# venv and re-applies them after every `hermes update`, which rebuilds that venv
# from its own lock and strips everything else. A plugin whose only dependency is
# in requirements.txt comes back from an update unable to import telethon.
python_dependencies:
  - "telethon>=1.44,<2"
  - "python-socks[asyncio]>=2.4,<3"
  - "qrcode>=7"
requires_env:
  - name: HERMES_TG_USER_API_ID
    description: Telegram API ID from my.telegram.org
    prompt: Telegram API ID
    password: false
  - name: HERMES_TG_USER_API_HASH
    description: Telegram API hash from my.telegram.org
    prompt: Telegram API hash
    password: true
optional_env:
  # Accounts are listed here and logged in with
  # `hermes telegram-user login --account <name> [--mode write] [--proxy URL]`,
  # which writes HERMES_TG_USER_<NAME>_SESSION / _MODE / _PROXY. Without the list,
  # the old single HERMES_TG_USER_SESSION is one read-only account called "default".
  - name: HERMES_TG_USER_ACCOUNTS
    description: Comma-separated account names, e.g. personal,agent (the first is the default)
    prompt: Telegram account names
    password: false
  - name: HERMES_TG_USER_SEND_FILE_ROOTS
    description: Directories (separated by ':') that tg_send_file may send files from; unset disables file sending
    prompt: Directories files may be sent from
    password: false
  - name: HERMES_TG_USER_MAX_MEDIA_MB
    description: Maximum Telegram attachment size cached/downloaded by the plugin; default 50 MB
    prompt: Maximum media MB
    password: false
  - name: HERMES_TG_USER_FLOOD_SLEEP_THRESHOLD
    description: FloodWait seconds Telethon may sleep internally; default 30, 0 disables silent FloodWait sleep
    prompt: FloodWait sleep threshold
    password: false
  - name: HERMES_TG_USER_MAX_CONCURRENT_TOOLS
    description: Maximum concurrent Telegram tool clients in this Hermes process; default 3
    prompt: Telegram tool concurrency
    password: false
  - name: HERMES_TG_USER_TOOL_MIN_INTERVAL_MS
    description: Minimum spacing between Telegram tool-call starts; default 150 ms
    prompt: Telegram tool spacing ms
    password: false
  - name: HERMES_TG_USER_STATE_DIR
    description: Directory for private alias/transcript state; defaults to ~/.hermes/state/telegram-user
    prompt: Telegram plugin state directory
    password: false
hooks:
  - pre_tool_call
provides_tools:
  - tg_list_chats
  - tg_accounts
  - tg_read_inbox
  - tg_mark_inbox
  - tg_send_message
  - tg_send_file
  - tg_forward_messages
  - tg_send_reaction
  - tg_edit_message
  - tg_delete_messages
  - tg_pin_message
  - tg_mark_read
  - tg_find_chat
  - tg_list_topics
  - tg_read_messages
  - tg_get_message_context
  - tg_search_messages
  - tg_search_global
  - tg_list_folders
  - tg_get_unread
  - tg_read_folder
  - tg_search_media
  - tg_download_media
  - tg_transcribe_voice
  - tg_contacts
  - tg_participants
  - tg_set_alias
  - tg_list_aliases
  - tg_delete_alias
  - tg_get_pinned
  - tg_get_drafts
  - tg_get_scheduled
  - tg_get_profile
  - tg_get_sessions
  - tg_archive_sync
  - tg_archive_search
  - tg_archive_status
  - tg_archive_forget
  - tg_list_digest_marks
  - tg_forget_digest_marks
  - tg_mark_summarized
  - tg_save_collection
  - tg_list_collections
  - tg_set_collection_brief
  - tg_delete_collection
  - tg_read_collection
  - tg_delegate_dialog
  - tg_list_delegations
  - tg_dialog_read
  - tg_dialog_message
  - tg_close_delegation
