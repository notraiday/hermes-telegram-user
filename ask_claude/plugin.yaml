name: ask-claude
label: Ask Claude (cloud consult)
version: "0.2.0"
description: One tool, ask_claude — the local agent consults cloud Claude on a hard question, through Claude Code on the owner's Claude subscription. Only the question leaves, scrubbed of personal data by fixed rules; every call is logged.
author: community
# Settings live in config.yaml under plugins.entries.ask-claude.settings and show
# up in the Plugins hub of Hermes Desktop.
config_schema:
  model:
    type: str
    default: opus
    description: Claude Code model — opus, sonnet, fable, or a full model id
  effort:
    type: str
    default: high
    description: How hard the model thinks — low, medium, high, xhigh or max
  claude_path:
    type: str
    default: ""
    description: Path to the claude command; empty — found on PATH or in ~/.local/bin
  timeout_minutes:
    type: int
    default: 15
    description: How long one answer may take
  proxy:
    type: str
    default: ""
    description: HTTP(S) proxy for Claude Code only, e.g. http://10.0.0.108:8080 or http://user:pass@host:port (no SOCKS); empty — the proxy Hermes runs with, if any
  token:
    type: secret
    env: ASK_CLAUDE_TOKEN
    description: Token from `claude setup-token` (your Claude subscription). Kept under its own name, never as CLAUDE_CODE_OAUTH_TOKEN, so Hermes itself does not pick it up
provides_tools:
  - ask_claude
